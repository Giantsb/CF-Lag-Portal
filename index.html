
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CrossFit Lagos | Membership Portal</title>

  <!-- Favicon for desktop browsers -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">

  <!-- iOS home screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://cflagos-icons.netlify.app/cfl-icon-180.png">

  <!-- Android and PWA icons -->
  <link rel="icon" type="image/png" sizes="190x190" href="https://cflagos-icons.netlify.app/cfl-icon-190.png">
  <link rel="icon" type="image/png" sizes="500x500" href="https://cflagos-icons.netlify.app/cfl-icon-500.png">

  <!-- Manifest for PWA -->
  <link rel="manifest" href="/manifest.json">

  <!-- Theme color for browsers -->
  <meta name="theme-color" content="#067A50">

  <!-- iOS PWA capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CrossFit Lagos">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      /* Backgrounds */
      --bg-primary: #191919;       /* slate-950: Main deep dark background */
      --bg-secondary: #0f172a;     /* slate-800: Card/section background */

      /* Text */
      --text-primary: #fcfcfc;     /* slate-50: Main light text on dark background */
      --text-secondary: #d4d4d4;   /* slate-400: Secondary light text/labels */
      
      /* Accent (Deep Forest Green) */
      --accent: #046540;           /* NEW ACCENT: Deep Forest Green */
      --accent-hover: #067A50;     /* Suggested darker shade for hover/active state */
      --accent-text: #f8fafc;      /* CRITICAL: Light text on dark accent for contrast */
      
      /* UI Elements */
      --border-color: rgba(255, 255, 255, 0.1);
      --surface-highlight: rgba(255, 255, 255, 0.05);
      --input-bg: #0f172a;
      --card-header-bg: rgba(0, 0, 0, 0.2);
    }

    [data-theme='light'] {
      /* Light Theme */
      --bg-primary: #f1f5f9;      /* slate-100 */
      --bg-secondary: #ffffff;    /* white */
      --text-primary: #0f172a;    /* slate-900 */
      --text-secondary: #64748b;  /* slate-500 */
      --accent: #046540;          /* lime-700 (darker for visibility on light bg) */
      --accent-hover: #3f6212;    /* lime-800 */
      --accent-text: #ffffff;     /* white text on dark accent */
      --border-color: #e2e8f0;    /* slate-200 */
      --surface-highlight: #f8fafc; /* slate-50 */
      --input-bg: #ffffff;
      --card-header-bg: #f1f5f9;
    }
    
    body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Custom Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideInDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes slideInUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes scaleIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes announcementEnter {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.97);
      }
      60% {
        opacity: 1;
        transform: translateY(-2px) scale(1.01);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes announcementAttentionPulse {
      0% {
        box-shadow: 0 0 0 0 var(--announcement-glow, rgba(6, 122, 80, 0.32));
      }
      50% {
        box-shadow: 0 0 0 8px rgba(0, 0, 0, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
      }
    }

    /* Native Brand Splash Keyframes */
    @keyframes splashGlowIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.82); }
      to { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes splashGlowBreathe {
      0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.65; }
      50% { transform: translate(-50%, -50%) scale(1.08); opacity: 0.92; }
    }

    @keyframes splashHorizonDraw {
      0% {
        stroke-dashoffset: 440;
        opacity: 0;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes splashSkylineRise {
      0% {
        opacity: 0;
        transform: translateY(20px) scaleY(0.88);
        clip-path: inset(100% 0 0 0);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scaleY(1);
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes splashKickerReveal {
      0% {
        opacity: 0;
        letter-spacing: 0.38em;
        transform: translateY(6px);
      }
      100% {
        opacity: 1;
        letter-spacing: 0.22em;
        transform: translateY(0);
      }
    }

    @keyframes splashWordmarkPunch {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.95);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes splashMetallicSheen {
      0% {
        transform: translateX(-140%) skewX(-24deg);
        opacity: 0;
      }
      30% {
        opacity: 0.65;
      }
      70%, 100% {
        transform: translateX(260%) skewX(-24deg);
        opacity: 0;
      }
    }

    @keyframes splashFadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes splashBarSlide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    @keyframes splashEmberRise {
      0% { transform: translateY(24px) scale(0.6); opacity: 0; }
      20% { opacity: 0.7; }
      85% { opacity: 0.25; }
      100% { transform: translateY(-150px) scale(1.05); opacity: 0; }
    }

    /* Fitness Loaders Keyframes */
    @keyframes barbellLift {
      0%, 100% { transform: translateY(18px) scale(0.98); }
      50% { transform: translateY(-18px) scale(1.02); }
    }
    @keyframes plateFlexLeft {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-3deg); }
      75% { transform: rotate(3deg); }
    }
    @keyframes plateFlexRight {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(3deg); }
      75% { transform: rotate(-3deg); }
    }
    @keyframes plateSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes platePulse {
      0%, 100% { transform: scale(0.92) rotate(0deg); filter: drop-shadow(0 0 10px rgba(249,115,22,0.3)); }
      50% { transform: scale(1.08) rotate(180deg); filter: drop-shadow(0 0 25px rgba(249,115,22,0.7)); }
    }
    @keyframes kettlebellSwing {
      0%, 100% { transform: rotate(-28deg) translateY(0); }
      50% { transform: rotate(28deg) translateY(-8px); }
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1.3); opacity: 0.3; }
      50% { transform: scaleX(0.7); opacity: 0.7; }
    }
    @keyframes dumbbellCurl {
      0%, 100% { transform: translateY(12px) rotate(-15deg); }
      50% { transform: translateY(-16px) rotate(15deg); }
    }
    @keyframes ringSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
    .animate-slideInDown { animation: slideInDown 0.4s ease-out forwards; }
    .animate-slideInUp { animation: slideInUp 0.4s ease-out forwards; }
    .animate-scaleIn { animation: scaleIn 0.3s ease-out forwards; }
    .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
    .animate-announcement-card {
      animation:
        announcementEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1) both,
        announcementAttentionPulse 1.6s ease-out 0.35s 2;
    }
    .announcement-glow-info { --announcement-glow: rgba(6, 122, 80, 0.32); }
    .announcement-glow-warning { --announcement-glow: rgba(245, 158, 11, 0.35); }
    .announcement-glow-urgent { --announcement-glow: rgba(239, 68, 68, 0.42); }

    .splash-glow-anim {
      animation:
        splashGlowIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.08s forwards,
        splashGlowBreathe 3.8s ease-in-out 0.95s infinite;
    }
    .splash-horizon-anim {
      stroke-dasharray: 440;
      stroke-dashoffset: 440;
      animation: splashHorizonDraw 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .splash-skyline-anim {
      opacity: 0;
      transform-origin: bottom center;
      animation: splashSkylineRise 0.88s cubic-bezier(0.16, 1, 0.3, 1) 0.16s forwards;
    }
    .splash-kicker-anim {
      opacity: 0;
      animation: splashKickerReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.42s forwards;
    }
    .splash-wordmark-anim {
      opacity: 0;
      animation: splashWordmarkPunch 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.56s forwards;
    }
    .splash-sheen-anim {
      animation: splashMetallicSheen 3.2s cubic-bezier(0.4, 0, 0.2, 1) 0.9s infinite;
    }
    .splash-fade-up {
      opacity: 0;
      animation: splashFadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) var(--splash-delay, 0.72s) forwards;
    }
    .splash-bar-slide {
      animation: splashBarSlide 1.35s ease-in-out infinite;
    }
    .splash-ember {
      animation: splashEmberRise var(--ember-dur, 4.5s) linear var(--ember-delay, 0.4s) infinite;
    }

    .brand-logo-adaptive {
      filter: invert(1) hue-rotate(180deg) brightness(1.06) contrast(1.08);
    }
    [data-theme='light'] .brand-logo-adaptive {
      filter: none;
    }

    .splash-fast .splash-horizon-anim {
      animation-duration: 0.42s;
    }
    .splash-fast .splash-skyline-anim {
      animation-duration: 0.48s;
      animation-delay: 0.08s;
    }
    .splash-fast .splash-kicker-anim {
      animation-duration: 0.42s;
      animation-delay: 0.18s;
    }
    .splash-fast .splash-wordmark-anim {
      animation-duration: 0.45s;
      animation-delay: 0.24s;
    }
    .splash-fast .splash-sheen-anim {
      animation-delay: 0.45s;
    }
    .splash-fast .splash-fade-up {
      animation-duration: 0.38s;
      animation-delay: 0.28s;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-announcement-card,
      .splash-glow-anim,
      .splash-horizon-anim,
      .splash-skyline-anim,
      .splash-kicker-anim,
      .splash-wordmark-anim,
      .splash-sheen-anim,
      .splash-fade-up,
      .splash-bar-slide,
      .splash-ember {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
        clip-path: none !important;
        stroke-dashoffset: 0 !important;
      }
      .splash-sheen-anim {
        opacity: 0 !important;
      }
    }

    /* Fitness Loader Animation Classes */
    .animate-barbell-lift { animation: barbellLift var(--loader-speed, 1.2s) cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .animate-plate-left { animation: plateFlexLeft var(--loader-speed, 1.2s) ease-in-out infinite; }
    .animate-plate-right { animation: plateFlexRight var(--loader-speed, 1.2s) ease-in-out infinite; }
    .animate-plate-spin { animation: plateSpin var(--loader-speed, 1.5s) linear infinite; }
    .animate-plate-pulse { animation: platePulse var(--loader-speed, 2s) ease-in-out infinite; }
    .animate-kettlebell-swing { animation: kettlebellSwing var(--loader-speed, 1.1s) ease-in-out infinite alternate; }
    .animate-shadow-pulse { animation: shadowPulse var(--loader-speed, 1.1s) ease-in-out infinite alternate; }
    .animate-dumbbell-curl { animation: dumbbellCurl var(--loader-speed, 1s) ease-in-out infinite; }
    .animate-ring-spin { animation: ringSpin var(--loader-speed, 1.4s) cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite; }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

  <!-- Google Fonts for IBM Plex Sans & Outfit (Splash Wordmark) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            ibm: ['"IBM Plex Sans"', 'sans-serif'],
            display: ['"IBM Plex Sans"', 'sans-serif'],
            logo: ['"Outfit"', '"IBM Plex Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              black: 'var(--bg-primary)',
              dark: 'var(--bg-secondary)',
              accent: 'var(--accent)',
              accentHover: 'var(--accent-hover)',
              accentText: 'var(--accent-text)',
              danger: '#ef4444',
              success: '#22c55e',
              textPrimary: 'var(--text-primary)',
              textSecondary: 'var(--text-secondary)',
              border: 'var(--border-color)',
              surface: 'var(--surface-highlight)',
              input: 'var(--input-bg)',
              header: 'var(--card-header-bg)'
            }
          },
          keyframes: {
            barbellLift: { '0%, 100%': { transform: 'translateY(18px) scale(0.98)' }, '50%': { transform: 'translateY(-18px) scale(1.02)' } },
            plateFlexLeft: { '0%, 100%': { transform: 'rotate(0deg)' }, '25%': { transform: 'rotate(-3deg)' }, '75%': { transform: 'rotate(3deg)' } },
            plateFlexRight: { '0%, 100%': { transform: 'rotate(0deg)' }, '25%': { transform: 'rotate(3deg)' }, '75%': { transform: 'rotate(-3deg)' } },
            plateSpin: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } },
            platePulse: { '0%, 100%': { transform: 'scale(0.92) rotate(0deg)', filter: 'drop-shadow(0 0 10px rgba(249,115,22,0.3))' }, '50%': { transform: 'scale(1.08) rotate(180deg)', filter: 'drop-shadow(0 0 25px rgba(249,115,22,0.7))' } },
            kettlebellSwing: { '0%, 100%': { transform: 'rotate(-28deg) translateY(0)' }, '50%': { transform: 'rotate(28deg) translateY(-8px)' } },
            shadowPulse: { '0%, 100%': { transform: 'scaleX(1.3)', opacity: '0.3' }, '50%': { transform: 'scaleX(0.7)', opacity: '0.7' } },
            dumbbellCurl: { '0%, 100%': { transform: 'translateY(12px) rotate(-15deg)' }, '50%': { transform: 'translateY(-16px) rotate(15deg)' } },
            ringSpin: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } }
          },
          animation: {
            'barbell-lift': 'barbellLift var(--loader-speed, 1.2s) cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite',
            'plate-left': 'plateFlexLeft var(--loader-speed, 1.2s) ease-in-out infinite',
            'plate-right': 'plateFlexRight var(--loader-speed, 1.2s) ease-in-out infinite',
            'plate-spin': 'plateSpin var(--loader-speed, 1.5s) linear infinite',
            'plate-pulse': 'platePulse var(--loader-speed, 2s) ease-in-out infinite',
            'kettlebell-swing': 'kettlebellSwing var(--loader-speed, 1.1s) ease-in-out infinite alternate',
            'shadow-pulse': 'shadowPulse var(--loader-speed, 1.1s) ease-in-out infinite alternate',
            'dumbbell-curl': 'dumbbellCurl var(--loader-speed, 1s) ease-in-out infinite',
            'ring-spin': 'ringSpin var(--loader-speed, 1.4s) cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite'
          }
        }
      }
    }
  </script>

  <!-- Import maps for modules -->
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "crypto-js": "https://esm.sh/crypto-js@4.2.0",

    "firebase/messaging": "https://esm.sh/firebase@10.8.0/messaging?deps=firebase@10.8.0",
    "firebase/auth": "https://esm.sh/firebase@10.8.0/auth?deps=firebase@10.8.0",
    "firebase/firestore": "https://esm.sh/firebase@10.8.0/firestore?deps=firebase@10.8.0",
    "firebase/analytics": "https://esm.sh/firebase@10.8.0/analytics?deps=firebase@10.8.0",
    "date-fns": "https://esm.sh/date-fns@3.3.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "firebase/": "https://esm.sh/firebase@^12.7.0/"
  }
}
</script>

</head>

<body class="bg-brand-black text-brand-textPrimary overscroll-none">
  <div id="root"></div>

  <script type="module" src="/index.tsx"></script>
</body>
</html>
